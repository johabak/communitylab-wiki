theme:
  name: 'material'
  language: nb
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables

extra:
  social:
    - icon: fontawesome/brands/github 
      link: https://github.com/johabak/communitylab-wiki/

site_name: 'Community Network - Community Lab'
site_url: 'https://communitylab.network/'
repo_name: johabak/communitylab-wiki
repo_url: https://github.com/johabak/communitylab-wiki/

nav:
  - Hjem: index.md
  - Om Community Lab:
    - Om tilbudet: Informasjon/info.md
    - Status: Informasjon/status.md
    - Bidra: Informasjon/bidra.md
    - Kontakt og hjelp: Informasjon/kontakt.md
  - Labmiljøer:
    - Cisco Modeling Labs:
      - Om CML: Cisco_Modeling_Labs_(CML)/index.md
      - Reservasjon: Cisco_Modeling_Labs_(CML)/cml_booking.md
      - Laboppgaver: Cisco_Modeling_Labs_(CML)/laboppgaver.md
    - Zscaler:
      - Om Zscaler-miljøet: Zscaler/index.md
      - Kom i gang: Zscaler/zscaler_lab.md
    - Illumio:
      - Status og planlagt innhold: Illumio/index.md
  - Arkiverte miljøer:
    - Fortinet:
      - Oversikt: Fortinet/index.md
      - SD-WAN-lab:
        - Om miljøet: Fortinet/SDWAN_Lab/index.md
        - FortiManager: Fortinet/SDWAN_Lab/fortimanager.md
        - FortiGate-hub: Fortinet/SDWAN_Lab/fortigate.md
        - FortiGate-spoke: Fortinet/SDWAN_Lab/spoke.md
    - Aruba:
      - Oversikt: Aruba/index.md
      - Aruba ClearPass: Aruba/Clearpass/clearpass.md
